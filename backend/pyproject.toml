[project]
name = "cryptoscope-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "lief>=0.14.0",
    "capstone>=5.0.0",
    "networkx>=3.2.0",
    "pyelftools>=0.31",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "torch",
    "shap>=0.45.0",
    "optuna>=3.6.0",
    "joblib>=1.3.0",
    "reportlab>=4.1.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
